# Publishes the public/ folder to GitHub Pages whenever main changes.
# One-time setup: repository Settings > Pages > Build and deployment > Source: GitHub Actions.
# The page then calls the server routes on the Netlify site (see public/js/config.js).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["public/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
